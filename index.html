.card{

/* BUTTON */

.btn{
display:inline-block;

padding:17px 45px;

border-radius:18px;

background:
linear-gradient(
135deg,
#00c6ff,
#005bbb
);

color:#fff;

font-family:'Inter',sans-serif;

font-weight:800;

text-decoration:none;

font-size:14px;

letter-spacing:-0.1px;

transition:0.4s ease;

box-shadow:
0 15px 40px rgba(0,176,255,0.6);

position:relative;

overflow:hidden;
}

.btn::before{
content:"";

position:absolute;

top:0;
left:-120%;

width:120%;
height:100%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.4),
transparent
);

transition:0.6s;
}

.btn:hover::before{
left:120%;
}

.btn:hover{
transform:translateY(-5px);

box-shadow:
0 25px 60px rgba(0,176,255,1);
}


/* POINTS */

.points{
list-style:none;

font-weight:600;

/* ANIMATION */

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}
